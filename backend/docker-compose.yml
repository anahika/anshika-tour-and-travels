version: "3.8"

services:
  frontend:
    image: frontend
    container_name: frontend
    build:
      context: ../frontend  # Path to frontend directory
      dockerfile: Dockerfile
    ports:
      - "3000:80"  # Map container's port 80 to host's port 3000
    networks:
      - my-network

  eureka-server:
    image: eureka-server
    container_name: eureka-server
    build:
      context: ./eureka-server  # Ensure this directory exists with a Dockerfile
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - my-network

  api-gateway:
    image: api-gateway
    container_name: api-gateway
    build:
      context: ./api-gateway  # Path to API Gateway directory
      dockerfile: Dockerfile
    ports:
      - "8070:8070"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka  # ✅ Fixed Eureka reference
    depends_on:
      - eureka-server
    networks:
      - my-network

  tour-service:
    image: tour-service
    container_name: tour-service
    build:
      context: ./tour-service  # Path to Tour Service directory
      dockerfile: Dockerfile
    ports:
      - "8766:8766"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/anshika_travels
      - SPRING_DATASOURCE_USERNAME=arana
      - SPRING_DATASOURCE_PASSWORD=anshika
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka  # ✅ Fixed Eureka reference
    depends_on:
      - eureka-server
      - postgres
    networks:
      - my-network

  user-service:
    image: user-service
    container_name: user-service
    build:
      context: ./user-service  # Path to User Service directory
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/anshika_travels
      - SPRING_DATASOURCE_USERNAME=arana
      - SPRING_DATASOURCE_PASSWORD=anshika
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka  # ✅ Fixed Eureka reference
    depends_on:
      - eureka-server
      - postgres
    networks:
      - my-network

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: arana
      POSTGRES_PASSWORD: anshika
      POSTGRES_DB: anshika_travels
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - my-network
    healthcheck:  # ✅ Moved healthcheck inside postgres
      test: ["CMD-SHELL", "pg_isready -U arana -d anshika_travels"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  my-network:
    driver: bridge

volumes:
  postgres-data:
